name: Build macOS App

on:
  push:
    branches: [ main, master, develop ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Display Python version
      run: python -c "import sys; print(f'Python {sys.version}')"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build macOS app
      run: |
        python -m PyInstaller RegisterWiFiMAC-macos.spec
    
    - name: Make executable
      run: |
        chmod +x "dist/RegisterWiFiMAC.app/Contents/MacOS/RegisterWiFiMAC"
    
    - name: Create DMG (optional)
      run: |
        brew install create-dmg
        create-dmg \
          --volname "RegisterWiFiMAC" \
          --volicon "dist/RegisterWiFiMAC.app/Contents/Resources/AppIcon.icns" 2>/dev/null || true \
          --window-pos 200 120 \
          --window-size 500 350 \
          --icon-size 64 \
          --icon "RegisterWiFiMAC.app" 100 100 \
          "dist/RegisterWiFiMAC.dmg" \
          "dist/RegisterWiFiMAC.app" || echo "DMG creation skipped (no icon)"
    
    - name: Upload app as artifact
      uses: actions/upload-artifact@v3
      with:
        name: RegisterWiFiMAC-macOS
        path: dist/RegisterWiFiMAC.app
        retention-days: 30
    
    - name: Upload DMG as artifact (if created)
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: RegisterWiFiMAC-macOS-DMG
        path: dist/RegisterWiFiMAC.dmg
        retention-days: 30
      continue-on-error: true
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/RegisterWiFiMAC.app
          dist/RegisterWiFiMAC.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
