name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build Windows executable
      run: python -m PyInstaller RegisterWiFiMAC-windows.spec
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: RegisterWiFiMAC-Windows
        path: dist/RegisterWiFiMAC.exe

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build macOS app
      run: python -m PyInstaller RegisterWiFiMAC-macos.spec
    
    - name: Make executable
      run: chmod +x "dist/RegisterWiFiMAC.app/Contents/MacOS/RegisterWiFiMAC"
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: RegisterWiFiMAC-macOS
        path: dist/RegisterWiFiMAC.app

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/download-artifact@v3
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          RegisterWiFiMAC-Windows/RegisterWiFiMAC.exe
          RegisterWiFiMAC-macOS/RegisterWiFiMAC.app
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
